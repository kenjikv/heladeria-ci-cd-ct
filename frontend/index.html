<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heladería</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #fdf6ec; color: #2b2b2b; margin: 0; }
    main { max-width: 420px; margin: 48px auto; padding: 0 16px; }
    .tarjeta { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px #0001; margin-bottom: 16px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    label { display: block; margin: 16px 0 8px; }
    input[type=range] { width: 100%; }
    .resultado { font-size: 3rem; font-weight: 700; color: #d9480f; margin: 8px 0 0; }
    .modelo { font-size: 0.9rem; color: #555; line-height: 1.6; }
    code { background: #f1f1f1; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="tarjeta">
      <h1>🍦 Heladería</h1>
      <p>¿Cuántos helados se venderán hoy?</p>

      <label for="temperatura">Temperatura: <strong id="grados">25</strong> °C</label>
      <input id="temperatura" type="range" min="-10" max="50" step="1" value="25">

      <p class="resultado" id="ventas">…</p>
      <p>helados en el día</p>
    </div>

    <div class="tarjeta modelo">
      <strong>Modelo desplegado</strong><br>
      <span id="modelo">cargando…</span>
    </div>
  </main>

  <script>
    const control = document.getElementById("temperatura");

    // Pide la predicción al backend y la muestra
    async function predecir() {
      document.getElementById("grados").textContent = control.value;
      const respuesta = await fetch(`/api/predecir?temperatura=${control.value}`);
      const datos = await respuesta.json();
      document.getElementById("ventas").textContent = datos.ventas;
    }

    // Muestra qué modelo está desplegado (cambia cada vez que el CT reentrena)
    async function cargarModelo() {
      const m = await (await fetch("/api/modelo")).json();
      const signo = m.intercepto < 0 ? "−" : "+";
      document.getElementById("modelo").innerHTML =
        `<code>ventas = ${m.pendiente} × temperatura ${signo} ${Math.abs(m.intercepto)}</code><br>` +
        `Error medio: ${m.mae} helados por día · ${m.dias} días de datos<br>` +
        `Entrenado: ${m.entrenado}`;
    }

    control.addEventListener("input", predecir);
    cargarModelo();
    predecir();
  </script>
</body>
</html>
