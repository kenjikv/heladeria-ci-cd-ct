# CT (entrenamiento continuo): llegan datos nuevos, se verifican, se revisa si el
# modelo sigue sirviendo y, si no, se reentrena, se guarda y se despliega (CI/CD).
name: CT

on:
  schedule:
    - cron: "0 12 * * 1"   # cada lunes a las 12:00 UTC (08:00 en Bolivia)
  workflow_dispatch:       # o a mano, eligiendo qué pasó en la heladería
    inputs:
      escenario:
        description: "¿Qué pasó en la heladería esta semana?"
        type: choice
        options: [normal, verano, precio_alto, datos_malos]
        default: normal

permissions:
  contents: write   # guardar el modelo nuevo en el repositorio
  actions: write    # lanzar el CI/CD después de guardarlo

env:
  ESCENARIO: ${{ inputs.escenario || 'normal' }}   # la ejecución programada usa "normal"

jobs:
  reentrenar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: 1. Llegan datos nuevos (simulados)
        run: python src/simular_datos.py $ESCENARIO datos/nuevos.csv

      - name: 2. Verificar los datos nuevos
        run: python src/validar_datos.py datos/nuevos.csv

      - name: 3. Revisar drift
        id: drift
        run: python src/revisar_drift.py datos/nuevos.csv

      - name: 4. Reentrenar con los datos nuevos
        if: steps.drift.outputs.reentrenar == 'true'
        run: |
          cp datos/nuevos.csv datos/ventas.csv
          python src/entrenar.py datos/ventas.csv

      - name: 5. Guardar el modelo y lanzar el CI/CD
        if: steps.drift.outputs.reentrenar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/ventas.csv modelo/modelo.json
          git commit -m "CT: retrain model (scenario $ESCENARIO)"
          git push
          # Un push hecho con el GITHUB_TOKEN no dispara otros workflows: el CI/CD se lanza a mano
          gh workflow run ci-cd.yml --ref main
